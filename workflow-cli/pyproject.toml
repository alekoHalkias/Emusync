[project]
name = "workflow-cli"
version = "0.1.0"
description = "Standalone, project-agnostic CLI for skill-based development workflow orchestration"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",       # HTTP client for llama-swap
    "pyyaml>=6.0",       # Config file parsing
    "rich>=13.0",        # Terminal progress display
    "pydantic>=2.0",     # JSON schema validation for LLM responses
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
]

[project.scripts]
workflow-cli = "workflow_cli.__main__:main"

[tool.setuptools.packages.find]
include = ["workflow_cli*"]
